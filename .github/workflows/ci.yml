name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is intentionally absent: the suite currently fails
        # there in TestRunParallelSetupHooksConcurrency, TestIsProcessAlive,
        # TestNewTemplateVars, TestCopyFileContentAndMode and
        # TestByteCopyFallback. Add it back once those pass, so that a red
        # check always means a real regression.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Mirrors the goreleaser build matrix so a release cannot be the first
      # place a broken target shows up.
      - name: Build release targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/wt
          done

  lint:
    name: lint (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Findings are printed in the job log but do not fail the build: main
      # already trips several gosec taint-analysis rules plus one unparam.
      # Drop --issues-exit-code=0 to make lint blocking once that is cleaned up.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --issues-exit-code=0
