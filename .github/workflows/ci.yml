name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # Windows support is still being worked on, so report its status
          # without blocking merges. Drop this once it is reliably green.
          - os: windows-latest
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Mirrors the goreleaser build matrix so a release cannot be the first
      # place a broken target shows up.
      - name: Build release targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/wt
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    # NOTE: golangci-lint currently reports pre-existing findings on main
    # (gosec taint-analysis rules plus one unparam). This job reports them
    # without failing the build; remove continue-on-error once they are fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
